    <style>
      .white-stroke { fill: none; stroke: #ffffff; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .cyan-stroke { fill: none; stroke: #a3f3eb; stroke-width: 10; stroke-linecap: round; }
    </style>
  </defs>

  <circle cx="250" cy="250" r="230" fill="url(#bgGradient)"/>

  <path d="M 250 40 A 210 210 0 1 0 430 160" class="white-stroke" stroke-width="12"/>
  <path d="M 400 395 A 210 210 0 0 0 455 280" class="white-stroke" stroke-width="12"/>

  <g fill="#ffffff">
    <rect x="120" y="170" width="40" height="70" rx="20"/>
    <rect x="110" y="190" width="60" height="6" rx="3" fill="#1175ab"/>
    <rect x="110" y="205" width="60" height="6" rx="3" fill="#1175ab"/>
    <rect x="110" y="220" width="60" height="6" rx="3" fill="#1175ab"/>
    <path d="M 105 210 v 30 a 35 35 0 0 0 70 0 v -30" class="white-stroke"/>
    <line x1="140" y1="280" x2="140" y2="310" stroke="#ffffff" stroke-width="10"/>
    <line x1="110" y1="310" x2="170" y2="310" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g class="cyan-stroke">
    <path d="M 195 200 A 50 50 0 0 1 195 280"/>
    <path d="M 215 180 A 80 80 0 0 1 215 300"/>
