    <path d="M 365 130 v 40 h 40" fill="none"/>
    
    <line x1="335" y1="170" x2="355" y2="170"/>
    <line x1="335" y1="195" x2="385" y2="195"/>
    <line x1="335" y1="220" x2="385" y2="220"/>
    <line x1="335" y1="245" x2="365" y2="245"/>
    <line x1="335" y1="270" x2="385" y2="270"/>
    <line x1="335" y1="295" x2="375" y2="295"/>
  </g>

  <g transform="translate(365, 275) rotate(-35)" class="white-stroke">
